# Ansible Lint
# Definition: A static analysis tool that scans your Ansible YAML files (playbooks, roles, tasks) without executing them,
# checking for style violations, deprecated syntax, security risks, and best-practice violations.

- name: Configure nginx on Debian systems
  when: ansible_os_family == "Debian"
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Copy config file
      ansible.builtin.copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf
        mode: '0644'

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started