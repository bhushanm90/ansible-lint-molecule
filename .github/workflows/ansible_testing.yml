name: Test Ansible Role with ansible-lint & Molecule

on: 
  push: 
  workflow_dispatch:
   inputs:
      role_name:
        description: "Role name to pass as AWX extra var"
        required: false
        default: "webserver"
permissions:
  contents: write
      
jobs:
    test-ansible-lint:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4

        - name: Install Ansible lint
          run: |
            sudo apt-get update
            sudo apt-get install -y python3-pip
            sudo python3 -m pip install --upgrade --break-system-packages ansible-core ansible-lint

        - name: Verify Ansible versions
          run: |
            ansible --version
            ansible-lint --version
            python3 -c "import ansible; print(ansible.__version__)"

        - name: Run ansible-lint
          env:
            ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
          run: |
            ansible-lint "${ANSIBLE_ROLES_PATH}/webserver" --exclude="${ANSIBLE_ROLES_PATH}/webserver/molecule"

    test-ansible-molecule:
        runs-on: ubuntu-latest
        needs: test-ansible-lint
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        steps:
        - uses: actions/checkout@v4

        - name: Install Ansible and Molecule
          run: |
            pipx install --force --suffix=-molecule \
              "ansible-core==2.19.4" \
              --pip-args="--no-cache-dir"
            pipx inject ansible-core-molecule \
              "ansible-compat==25.1.5" \
              "ansible-lint==25.1.2" \
              "molecule==25.5.0" \
              "requests" \
              "molecule-plugins[docker]==25.8.12"
            echo "/opt/pipx/venvs/ansible-core-molecule/bin" >> "$GITHUB_PATH"
            mkdir -p "${ANSIBLE_COLLECTIONS_PATH}"
            /opt/pipx/venvs/ansible-core-molecule/bin/ansible-galaxy collection install \
              community.docker:3.10.2 \
              ansible.posix:1.4.0 \
              --force \
              --collections-path "${ANSIBLE_COLLECTIONS_PATH}"

        - name: Verify Ansible and Molecule versions
          run: |
            which -a ansible ansible-playbook molecule
            ansible --version
            ansible localhost -m ansible.builtin.setup -a 'filter=ansible_python*' -c local
            /opt/pipx/venvs/ansible-core-molecule/bin/python -c "import ansible, ansible_compat, molecule, requests; print(ansible.__version__)"
            /opt/pipx/venvs/ansible-core-molecule/bin/molecule --version
            find "${ANSIBLE_COLLECTIONS_PATH}" -maxdepth 4 -name MANIFEST.json -print
            ansible-galaxy collection list --collections-path "${ANSIBLE_COLLECTIONS_PATH}"
            ansible-doc community.docker.docker_container

        - name: runner user
          run: |
            whoami
            id
            id -Gn
     
        - name: Verify Docker daemon
          run: |
            docker info

        - name: Run Molecule tests
          env:
            ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
          run: |
            cd "${{ env.ANSIBLE_ROLES_PATH }}/webserver"
            /opt/pipx/venvs/ansible-core-molecule/bin/molecule test

    deploy-awx-template:
        runs-on: ubuntu-latest
        needs: test-ansible-molecule
        steps:
          - name: Launch AWX job template
            env:
              AWX_URL: ${{ vars.AWX_URL }}
              AWX_TOKEN: ${{ secrets.AWX_TOKEN }}
              AWX_TEMPLATE_ID: ${{ vars.AWX_TEMPLATE_ID }}
              AWX_ROLE_NAME: ${{ inputs.role_name || 'webserver' }}
            run: |
              payload=$(jq -n \
                --arg role_name "$AWX_ROLE_NAME" \
                '{extra_vars: {role_name: $role_name}}')

              curl --fail --silent --show-error -X POST \
                "$AWX_URL/api/v2/job_templates/$AWX_TEMPLATE_ID/launch/" \
                -H "Authorization: Bearer $AWX_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload"

    test_nginx_web_url:
        runs-on: ubuntu-latest
        needs: deploy-awx-template
        env:
          AWX_URL: ${{ vars.AWX_URL }}
        steps:
          - name: Show nginx web URL
            run: |
              echo "Nginx web URL: $AWX_URL"
              {
                echo "## Nginx web URL"
                echo "[$AWX_URL]($AWX_URL)"
              } >> "$GITHUB_STEP_SUMMARY"

          - name: Test nginx web URL
            run: |
              sleep 10  # Wait for the service to start
              if curl -s --head $AWX_URL | grep "200 OK" > /dev/null; then
                echo "Nginx is running and accessible."
              else
                echo "Nginx is not accessible."
                exit 1
              fi