name: Test Ansible Role with ansible-lint & Molecule

on: 
  push: 
  workflow_dispatch:
   inputs:
      role_name:
        description: "Role name to pass as AWX extra var"
        required: false
        default: "webserver"
permissions:
  contents: write
      
jobs:
    test-ansible-lint:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4

        - name: Install Ansible lint
          run: |
            sudo apt-get update
            sudo apt-get install -y python3-pip
            sudo python3 -m pip install --upgrade --break-system-packages ansible-core ansible-lint

        - name: Verify Ansible versions
          run: |
            ansible --version
            ansible-lint --version
            python3 -c "import ansible; print(ansible.__version__)"

        - name: Run ansible-lint
          env:
            ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
          run: |
            ansible-lint ${{env.ANSIBLE_ROLES_PATH}}/webserver --exclude=./ansible/roles/webserver/molecule

    test-ansible-molecule:
        runs-on: [self-hosted, linux, x64]
        needs: test-ansible-lint
        steps:
        - uses: actions/checkout@v4

        - name: Install Ansible and Molecule
          run: |
            sudo apt-get update
            sudo apt-get install -y docker.io python3-pip
            sudo python3 -m pip install --upgrade --break-system-packages ansible-core ansible-lint molecule "molecule-plugins[docker]"

        - name: Verify Ansible and Molecule versions
          run: |
            ansible --version
            python3 -c "import ansible; print(ansible.__version__)"
            molecule --version

        - name: runner user
          run: |
            whoami
            id
            id -Gn
     
        - name: Start Docker and verify daemon
          run: |
            sudo systemctl start docker || sudo service docker start
            sudo docker info

        - name: Run Molecule tests
          env:
            ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
          run: |
            cd "${{ env.ANSIBLE_ROLES_PATH }}/webserver"
            sudo -E env "ANSIBLE_ROLES_PATH=${ANSIBLE_ROLES_PATH}" molecule test

    deploy-awx-template:
        runs-on: [self-hosted, linux, x64]
        needs: test-ansible-molecule
        steps:
          - name: Launch AWX job template
            env:
              AWX_URL: ${{ vars.AWX_URL }}
              AWX_TOKEN: ${{ secrets.AWX_TOKEN }}
              AWX_TEMPLATE_ID: ${{ vars.AWX_TEMPLATE_ID }}
              AWX_ROLE_NAME: ${{ inputs.role_name || 'webserver' }}
            run: |
              payload=$(jq -n \
                --arg role_name "$AWX_ROLE_NAME" \
                '{extra_vars: {role_name: $role_name}}')

              curl --fail --silent --show-error -X POST \
                "$AWX_URL/api/v2/job_templates/$AWX_TEMPLATE_ID/launch/" \
                -H "Authorization: Bearer $AWX_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload"
